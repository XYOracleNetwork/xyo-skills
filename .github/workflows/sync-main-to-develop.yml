name: Sync main → develop after release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Open and merge sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Open and merge main → develop sync PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: |
            Post-release sync. Brings the version bump and changelog from `main` back into `develop` so the branches stay aligned for the next release cycle.

            Auto-created and auto-merged by `.github/workflows/sync-main-to-develop.yml` using the **merge-commit** method. Do not squash this PR — squashing breaks the ancestry link between `main` and `develop` and makes them drift over time.
        run: |
          set -euo pipefail

          ahead=$(gh api "repos/${{ github.repository }}/compare/develop...main" --jq '.ahead_by')
          if [[ "$ahead" -eq 0 ]]; then
            echo "Nothing to sync — develop already contains main."
            exit 0
          fi

          echo "Main is ahead of develop by $ahead commit(s); creating sync PR..."

          pr_url=$(gh pr create \
            --base develop \
            --head main \
            --title "chore: sync main → develop after ${TAG}" \
            --body "$BODY") || pr_url=""

          # Fall back to an existing open sync PR (e.g. if a previous run created one but couldn't merge).
          if [[ -z "$pr_url" || ! "$pr_url" =~ ^https:// ]]; then
            pr_url=$(gh pr list --base develop --head main --state open --json url --jq '.[0].url // ""')
          fi

          if [[ -z "$pr_url" ]]; then
            echo "ERROR: main is ahead of develop but no sync PR could be created or found." >&2
            exit 1
          fi

          # develop's branch protection requires status checks, so merging right after
          # creation is rejected ("base branch policy prohibits the merge"). Repo-level
          # auto-merge is disabled, so wait for the checks here before merging.
          # Checks take a few seconds to register on a new PR, and `gh pr checks` exits
          # non-zero while none are reported, so wait for them to appear first.
          echo "Waiting for checks to register on $pr_url..."
          for _ in $(seq 1 30); do
            count=$(gh pr view "$pr_url" --json statusCheckRollup --jq '.statusCheckRollup | length')
            [[ "$count" -gt 0 ]] && break
            sleep 10
          done

          # A required check can register after `--watch` returns, so re-watch and retry
          # the merge a few times before giving up. `--fail-fast` aborts on a failed check.
          for attempt in $(seq 1 5); do
            echo "Watching checks (attempt $attempt)..."
            gh pr checks "$pr_url" --watch --fail-fast --interval 15

            echo "Merging $pr_url with merge-commit method..."
            if gh pr merge "$pr_url" --merge; then
              exit 0
            fi
            sleep 20
          done

          echo "ERROR: $pr_url could not be merged after its checks passed." >&2
          exit 1
