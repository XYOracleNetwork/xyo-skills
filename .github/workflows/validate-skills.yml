# Validate skill frontmatter and concrete schema examples on relevant PRs.
# Catches malformed SKILL.md before merge so sync-skills.yml doesn't fail
# after the change has already landed in `develop`.

name: Validate skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/validate-skills.mjs'
      - 'scripts/schema-literals.mjs'
      - 'scripts/schema-literals.test.mjs'
      - '.github/workflows/validate-skills.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills and schema examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test scripts/schema-literals.test.mjs
      - run: node scripts/validate-skills.mjs skills
