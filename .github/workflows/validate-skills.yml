# Validate skill frontmatter, concrete schema examples, relative links and
# anchors, and the skill-stack layering rules on relevant PRs. Catches
# malformed SKILL.md and layer drift before merge so the release sync doesn't
# fail after the change has already landed in `develop`.

name: Validate skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/*.mjs'
      - '.github/workflows/validate-skills.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills and schema examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      # Unit tests for the validator's pure helpers (schema literals, GitHub
      # slugger, code-span masking, layer direction). The shell expands the glob.
      - run: node --test scripts/*.test.mjs
      # Errors fail the job; upward cross-layer links print as a ::warning table.
      - run: node scripts/validate-skills.mjs skills
